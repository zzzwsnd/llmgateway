[project]
name = "llmgateway"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.116,<1.0",
    "jsonschema>=4.25,<5.0",
    "openai>=1.109,<3.0",
    "pydantic>=2.11,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=0.1,<1.0",
    "pytest>=8.4,<10.0",
    "pytest-asyncio>=1.1,<2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette\\.testclient",
]
pythonpath = ["."]
testpaths = ["tests"]
